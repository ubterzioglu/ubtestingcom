# Crawler policy per URL. Matched on $request_uri because the SPA fallback rewrites $uri
# to /index.html before headers are emitted.
map $request_uri $robots_tag {
    default                      "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
    "~*^/ubtesting1/?(\?|$)"     "noindex, nofollow, noarchive, nosnippet";
    "~*^/healthz/?(\?|$)"        "noindex, nofollow";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag $robots_tag always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    # Crawler-facing files: cheap to refetch, must never go stale.
    location = /robots.txt {
        expires 1h;
    }

    location = /sitemap.xml {
        expires 1h;
    }

    location = /llms.txt {
        expires 1h;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    # Social and icon artwork referenced from the document head.
    location ~* ^/(og-image|icon-192|icon-512|icon-maskable-512|apple-touch-icon)\.png$ {
        expires 7d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;
}
